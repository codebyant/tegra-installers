name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check shell scripts
        run: shellcheck installers/steamos/install.sh

      - name: Test SteamOS installer
        run: node tests/steamos-installer.mjs

      - name: Build production image
        run: docker build -t tegra-installers .
